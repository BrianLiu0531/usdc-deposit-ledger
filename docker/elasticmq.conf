include classpath("application.conf")

# Mirrors the AWS setup in terraform/app: a FIFO queue whose messages move to a dead-letter queue
# after 3 failed receives. Visibility is short so local retries are quick.
queues {
  "usdc-transfers-dlq.fifo" {
    fifo = true
  }
  "usdc-transfers.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 3 seconds
    deadLettersQueue {
      name = "usdc-transfers-dlq.fifo"
      maxReceiveCount = 3
    }
  }
}
