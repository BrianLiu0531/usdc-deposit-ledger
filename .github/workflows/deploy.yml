# Deploys terraform/app with short-lived credentials from GitHub's OIDC token (no AWS keys stored).
# One-time setup: apply terraform/bootstrap, then add
#   secrets:   AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET (they contain the account ID; logs are public)
#   variables: WATCH_ADDRESSES (JSON list), and optionally ALARM_EMAIL
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write # to request the OIDC token
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      TF_VAR_watch_addresses: ${{ vars.WATCH_ADDRESSES }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/event ./internal/handler
      - name: Build the Lambda package
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -trimpath -ldflags="-s -w" -o dist/bootstrap ./cmd/consumer
          (cd dist && zip -q consumer.zip bootstrap)
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply
        working-directory: terraform/app
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve
          terraform output
